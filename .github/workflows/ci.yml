name: CI

on:
  push:
    branches:
      - develop
      - 'feature/**'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore Homies.sln

      - name: Build solution
        run: dotnet build Homies.sln --configuration Release --no-restore

      - name: Run all tests
        run: dotnet test Homies.sln --configuration Release --no-build --no-restore --verbosity normal
